name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish ColePortfolio.csproj -c Release -o release --nologo

      # GitHub Pages ignores files/folders starting with an underscore by default
      # (e.g. _framework). This file disables that behavior.
      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      # GitHub Pages serves /about from about.html, so a copy of index.html per route
      # makes deep links return 200 instead of 404.html (crawlers drop 404 pages).
      # Routes come from the @page directives, and the sitemap is built from the same list.
      - name: Add route pages and sitemap
        working-directory: release/wwwroot
        run: |
          routes=$(grep -ho '@page "/[a-z]\+"' ../../Pages/*.razor | sed 's/@page "\/\(.*\)"/\1/')
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            for r in $routes; do
              cp index.html "$r.html"
              echo "  <url><loc>https://colespitzer.com/$r</loc></url>"
            done
            echo '</urlset>'
          } > sitemap.xml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
