name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish ColePortfolio.csproj -c Release -o release --nologo

      # GitHub Pages ignores files/folders starting with an underscore by default
      # (e.g. _framework). This file disables that behavior.
      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      # index.html is checked in with base href="/" so local `dotnet run` works.
      # Here we rewrite it to "/<repo-name>/" just for the deployed copy, using
      # the actual repo name — so this never has to be edited by hand.
      - name: Set base href for GitHub Pages
        run: sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' release/wwwroot/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
